---
deployment:
  tasks:
    - export DEPLOYPATH=/home/istaeedu/public_html/

    # Copia los archivos del repo al sitio en vivo, incluyendo archivos ocultos como
    # .htaccess ("cp -R *" los omite porque el comodin "*" no matchea dotfiles).
    # El hosting NO tiene rsync (exit 127), por eso se usa tar por tubería.
    # Excluye .git y .github; no borra nada que no venga en el repo, asi que .env,
    # storage/logs y archivos subidos por usuarios (public/uploads,
    # public/assets/chat-knowledge, etc.) quedan intactos.
    - /bin/tar --exclude=.git --exclude=.github -cf - . | /bin/tar -xf - -C $DEPLOYPATH

    # PHP confirmado: /usr/local/bin/php (cuenta usa PHP 8.2, symlink de cPanel).
    # Composer instalado manualmente en el home de la cuenta (el hosting no lo trae
    # global ni permite exec()/shell_exec() desde PHP web). -d allow_url_fopen=1
    # porque el php.ini de línea de comandos del hosting lo trae apagado por defecto.
    # --no-scripts: el hosting deshabilita proc_open, y los scripts de composer
    # ("@php artisan package:discover") lo necesitan; se ejecutan abajo directamente.
    - /usr/local/bin/php -d allow_url_fopen=1 /home/istaeedu/composer.phar install --no-dev --optimize-autoloader --no-interaction --no-scripts --working-dir=$DEPLOYPATH
    - /usr/local/bin/php $DEPLOYPATH/artisan clear-compiled
    - /usr/local/bin/php $DEPLOYPATH/artisan package:discover --ansi

    - /usr/local/bin/php $DEPLOYPATH/artisan migrate --force
    - /usr/local/bin/php $DEPLOYPATH/artisan config:cache
    - /usr/local/bin/php $DEPLOYPATH/artisan route:cache
    - /usr/local/bin/php $DEPLOYPATH/artisan view:cache
